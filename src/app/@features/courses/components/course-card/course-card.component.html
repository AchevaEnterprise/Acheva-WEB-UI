<div
  class="flex flex-col justify-between border border-gray-200 rounded-lg w-full min-h-[200px] p-4 bg-white shadow-sm hover:shadow-md transition-shadow"
>
  <div class="flex-1">
    <h4 class="text-lg font-semibold text-gray-900 mb-1 line-clamp-2">
      {{ course()?.courseTitle }}
    </h4>
    <p class="text-gray-600 text-sm mb-4">
      {{ course()?.courseCode }} - {{ course()?.courseLoad }} Unit(s)
    </p>

    <div class="space-y-2">
      <p class="text-gray-500 text-xs flex items-center gap-2">
        <app-svg
          svgWidth="0.875rem"
          svgHeight="0.875rem"
          src="icons/general/calendar-icon.svg"
        ></app-svg>
        {{ course()?.semester }}
      </p>

      <p class="text-gray-500 text-xs flex items-center gap-2">
        <app-svg
          svgWidth="0.875rem"
          svgHeight="0.875rem"
          src="icons/general/role-icon.svg"
        ></app-svg>
        {{ course()?.level }}
      </p>

      <p class="text-gray-500 text-xs flex items-center gap-2">
        <app-svg
          svgWidth="0.875rem"
          svgHeight="0.875rem"
          src="icons/general/building-icon.svg"
        ></app-svg>
        {{ course()?.department?.name }}
      </p>
    </div>
  </div>

  <div class="flex justify-end mt-4">
    <button
      class="text-xs font-medium py-1.5 px-3 rounded transition-colors duration-200"
      style="background-color: #7bf; color: white"
      (click)="createResult()"
      onmouseover="this.style.backgroundColor='#f1f1f1'; this.style.color='#333';"
      onmouseout="this.style.backgroundColor='#7bf'; this.style.color='white';"
    >
      Create Result
    </button>
  </div>
</div>
