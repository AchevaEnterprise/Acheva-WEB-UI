<div id="container">
  <header class="flex justify-between gap-4 items-baseline">
    <div class="flex items-center gap-2">
      <app-svg
        svgWidth="1.3rem"
        svgHeight="1.3rem"
        src="icons/general/course-icon.svg"
      ></app-svg>
      <h3 class="acva-heading-5 fw-500">Course Template</h3>
    </div>

    <app-search-input placeholder="Search Courses..." />
  </header>

  <app-card
    [label]="'Recently used courses'"
    [showDivider]="true"
    [dividerClass]="'!mt-4'"
  >
    <div content class="p-4">
      @if (isloadingRecentCourses()) {
        <app-loader />
      }

      <ng-container *ngIf="recentCourses$ | async as recentCourses">
        @if (recentCourses.length > 0) {
          <div class="flex gap-4 overflow-x-auto">
            @for (course of recentCourses; track $index) {
              <app-course-card
                [course]="course"
                (useTemplateEvent)="createResult($event)"
              />
            }
          </div>
        } @else {
          <app-empty-state
            iconSrc="images/general/empty-doc.svg"
            description="You have no recent templates"
          />
        }
      </ng-container>
    </div>
  </app-card>

  <mat-divider class="!mt-8"></mat-divider>

  <header class="flex justify-between gap-4 items-baseline my-4">
    <h3 class="acva-heading-5 fw-500">Suggested Template</h3>
    <a class="text-blue-500 underline" routerLink="/">View all</a>
  </header>

  <mat-divider></mat-divider>

  <!-- COURSE TEMPLATE CARDS -->
  <div class="min-h-24">
    @if (isloadingCourses()) {
      <app-loader />
    }

    <ng-container *ngIf="courses$ | async as courses">
      @if (courses.length > 0) {
        <div class="grid lg:grid-cols-3 sm:grid-cols-2 gap-4 mt-4">
          @for (course of courses; track $index) {
            <app-course-card
              [course]="course"
              (useTemplateEvent)="createResult($event)"
            />
          }
        </div>
      } @else {
        <app-empty-state
          iconSrc="images/general/empty-doc.svg"
          description="You have no recent templates"
        />
      }
    </ng-container>
  </div>
</div>
