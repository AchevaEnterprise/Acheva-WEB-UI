<div class="p-6 min-w-[400px]">
  <!-- Header -->
  <div class="flex items-start gap-4 mb-4">
    <div
      class="flex-shrink-0 w-12 h-12 rounded-full flex items-center justify-center"
      [class]="data.isDangerous ? 'bg-red-100' : 'bg-orange-100'"
    >
      <mat-icon [class]="data.isDangerous ? 'text-red-600' : 'text-orange-600'">
        {{ data.isDangerous ? 'delete_outline' : 'warning' }}
      </mat-icon>
    </div>

    <div class="flex-1">
      <h2 class="acva-heading-6 fw-600 text-neutral-900 mb-2">
        {{ data.title }}
      </h2>
      <p class="acva-para-2 text-neutral-600 leading-relaxed">
        {{ data.message }}
      </p>
    </div>
  </div>

  <!-- Warning note for bulk deletion -->
  @if (data.count && data.count > 1) {
    <div class="bg-orange-50 border border-orange-200 rounded-lg p-3 mb-4">
      <div class="flex items-start gap-2">
        <mat-icon class="text-orange-600 text-sm mt-0.5">info</mat-icon>
        <p class="acva-caption text-orange-800">
          This will delete <strong>{{ data.count }} student entries</strong>.
          Make sure you have selected the correct entries.
        </p>
      </div>
    </div>
  }

  <!-- Actions -->
  <div class="flex justify-end gap-3 pt-4">
    <app-button
      [label]="data.cancelText || 'Cancel'"
      type="outline"
      class="btn-md"
      (clickEvent)="onCancel()"
    />

    <app-button
      [label]="data.confirmText || 'Delete'"
      type="clear"
      icon="icons/general/trash-icon.svg"
      class="btn-md"
      (clickEvent)="onConfirm()"
    />
  </div>
</div>
