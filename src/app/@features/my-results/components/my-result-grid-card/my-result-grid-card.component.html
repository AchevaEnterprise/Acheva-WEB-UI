<div
  class="bg-white border border-[#E5E7EB] rounded-[8px] w-full h-full shadow-sm"
>
  <div class="p-4">
    <!-- Header with title and status -->
    <div class="flex justify-between items-start mb-3">
      <div class="flex-1">
        <h4 class="acva-para-2 fw-500 text-[#111827] mb-1 line-clamp-2">
          {{ result()?.course?.courseTitle }}
        </h4>
        <p class="acva-caption text-[#6B7280] fw-400">
          {{ result()?.course?.courseCode }} -
          {{ result()?.course?.courseLoad }}
          Units
        </p>
      </div>
    </div>

    <!-- Course details -->
    <div class="space-y-2 mb-4">
      <div class="flex items-center gap-2 text-[#6B7280] acva-caption">
        <app-svg
          svgWidth="14px"
          svgHeight="14px"
          src="icons/general/calendar-icon.svg"
        ></app-svg>
        <span> {{ result()?.course?.semester }} - {{ result()?.session }}</span>
      </div>

      <div class="flex items-center gap-2 text-[#6B7280] acva-caption">
        <app-svg
          svgWidth="14px"
          svgHeight="14px"
          src="icons/general/role-icon.svg"
        ></app-svg>
        <span>0 Students</span>
      </div>
    </div>

    <!-- Progress bar -->
    <div class="w-full">
      <div class="flex justify-between items-center mb-2">
        <span class="acva-caption text-[#6B7280]"
          >{{ result()?.progress }}% done</span
        >
      </div>
      <div class="w-full bg-[#E5E7EB] rounded-full h-3">
        <div
          class="h-3 bg-[#2793FF] rounded-full transition-all duration-300"
          [style.width.%]="result()?.progress"
        ></div>
      </div>
    </div>
  </div>

  <!-- Footer with menu -->
  <div
    class="flex justify-end items-center px-4 py-2 bg-[#F9FAFB] border-t border-[#E5E7EB]"
  >
    <button [matMenuTriggerFor]="menu" class="cursor-pointer">
      <app-svg
        svgWidth="3rem"
        svgHeight="3rem"
        src="icons/general/option-icon.svg"
      ></app-svg>
    </button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item (click)="viewResult()">View Result</button>
      <!-- @if (result()?.isDraft) {
        <button mat-menu-item (click)="deleteResult()" class="text-red-600">
          Delete Result
        </button>
      } -->
    </mat-menu>
  </div>
</div>
