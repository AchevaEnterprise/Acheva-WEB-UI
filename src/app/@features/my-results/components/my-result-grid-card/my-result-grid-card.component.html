<div
  class="bg-white border border-[#E5E7EB] rounded-[8px] w-full h-full shadow-sm cursor-pointer"
  (click)="viewResult()"
  (keydown)="viewResult()"
>
  <div class="p-4">
    <!-- Header with title and status -->
    <div class="flex justify-between items-start gap-2 mb-3">
      <div class="flex-1">
        <h4 class="acva-para-2 fw-500 text-[#111827] mb-1 line-clamp-2">
          {{ result()?.course?.courseTitle }}
        </h4>
        <p class="acva-caption text-[#6B7280] fw-400">
          {{ result()?.course?.courseCode }} -
          {{ result()?.course?.courseLoad }}
          Units
        </p>
      </div>

      @if (isViewOnly()) {
        <span
          class="text-[10px] fw-500 text-[#6B7280] bg-[#F3F4F6] border border-[#E5E7EB] px-2 py-0.5 rounded-full whitespace-nowrap"
        >
          View only
        </span>
      }
    </div>

    <!-- Course details -->
    <div class="space-y-2 mb-4">
      <div class="flex items-center gap-2 text-[#6B7280] acva-caption">
        <app-svg
          svgWidth="14px"
          svgHeight="14px"
          src="icons/general/calendar-icon.svg"
        ></app-svg>
        <span> {{ result()?.course?.semester }} - {{ result()?.session }}</span>
      </div>

      <div class="flex items-center gap-2 text-[#6B7280] acva-caption">
        <app-svg
          svgWidth="14px"
          svgHeight="14px"
          src="icons/general/role-icon.svg"
        ></app-svg>
        <span>{{ result()?.students }} Students</span>
      </div>
    </div>

    <!-- Progress bar -->
    <div class="w-full">
      <div class="flex justify-between items-center mb-2">
        <span class="acva-caption text-[#6B7280]"
          >{{ result()?.progress }}% done</span
        >
      </div>
      <div class="w-full bg-[#E5E7EB] rounded-full h-3">
        <div
          class="h-3 bg-[#2793FF] rounded-full transition-all duration-300"
          [style.width.%]="result()?.progress"
        ></div>
      </div>
    </div>
  </div>
</div>
