<!-- class="grid [grid-template-columns:repeat(auto-fit,_minmax(0,_1fr))] gap-4 items-center" -->
<div class="flex flex-wrap gap-4 items-center w-full justify-between my-4">
  <div>
    <h5 class="acva-para-2 fw-500">{{ result()?.course?.courseTitle }}</h5>
    <p class="acva-para-1 fw-400 text-neutral-500">
      {{ result()?.course?.courseCode }}
    </p>
  </div>

  <p class="acva-para-1 fw-400">{{ result()?.course?.courseLoad }} Unit(s)</p>
  <p class="acva-para-1 fw-400">{{ result()?.semester }}</p>
  <p class="acva-para-1 fw-400">{{ result()?.session }}</p>
  <p class="acva-para-1 fw-400">0 Students</p>

  <div class="progress-container w-[20%]">
    <p class="acva-caption text-neutral-500 text-right">0% Done</p>
    <mat-progress-bar mode="determinate" value="0"></mat-progress-bar>
  </div>

  <button [matMenuTriggerFor]="menu" class="cursor-pointer">
    <app-svg
      svgWidth="3rem"
      svgHeight="3rem"
      src="icons/general/option-icon.svg"
    ></app-svg>
  </button>
  <mat-menu #menu="matMenu">
    <button mat-menu-item (click)="viewResult()">View Result</button>
  </mat-menu>
</div>

<mat-divider></mat-divider>
