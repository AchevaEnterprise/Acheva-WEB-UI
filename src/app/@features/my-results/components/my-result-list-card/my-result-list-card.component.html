<div
  class="bg-white border-b border-[#E5E7EB] p-4 rounded-lg mb-3 cursor-pointer"
  [class.disabled]="result()!.hasBeenSent | resultDisabled"
>
  <div
    class="flex items-center justify-between w-full gap-8"
    (click)="viewResult()"
    (keydown)="viewResult()"
  >
    <!-- Course Title and Code -->
    <div class="flex-1 min-w-0 pr-4">
      <h5 class="acva-para-2 fw-500 text-[#111827] mb-1 truncate">
        {{ result()?.course?.courseTitle }}
      </h5>
      <p class="acva-caption text-[#6B7280] fw-400">
        {{ result()?.course?.courseCode }}
      </p>
    </div>

    <!-- Units -->
    <div class="text-center px-4">
      <p class="acva-para-1 fw-400 text-[#374151]">
        {{ result()?.course?.courseLoad }} Units
      </p>
    </div>

    <!-- Semester -->
    <div class="text-center px-4">
      <p class="acva-para-1 fw-400 text-[#374151]">
        {{ result()?.course?.semester }}
      </p>
    </div>

    <!-- Session -->
    <div class="text-center px-4">
      <p class="acva-para-1 fw-400 text-[#374151]">{{ result()?.session }}</p>
    </div>

    <!-- Students Count -->
    <div class="text-center px-4">
      <p class="acva-para-1 fw-400 text-[#374151]">
        {{ result()?.students }} Students
      </p>
    </div>

    <!-- Progress -->
    <div class="flex items-center gap-3 px-4 min-w-[180px]">
      <div class="w-24">
        <div class="w-full bg-[#E5E7EB] rounded-full h-3">
          <div
            class="h-3 bg-[#2793FF] rounded-full transition-all duration-300"
            [style.width.%]="result()?.progress"
          ></div>
        </div>
      </div>
      <span class="acva-caption text-[#6B7280] whitespace-nowrap">
        {{ result()?.progress }}% done
      </span>
    </div>
  </div>
</div>
