@if (dataSource().length > 0) {
  <div class="w-full overflow-auto">
    <table mat-table [dataSource]="rows.controls">
      <ng-container matColumnDef="registrationNumber">
        <th mat-header-cell *matHeaderCellDef>REG NO</th>
        <td mat-cell *matCellDef="let element">
          {{ element.registrationNumber }}
        </td>
      </ng-container>

      <ng-container matColumnDef="fullName">
        <th mat-header-cell *matHeaderCellDef>NAME</th>
        <td mat-cell *matCellDef="let element">
          {{ element.fullName }}
        </td>
      </ng-container>

      <ng-container matColumnDef="test">
        <th mat-header-cell *matHeaderCellDef>TEST</th>
        <td
          mat-cell
          *matCellDef="let element"
          class="text-center"
          [formGroup]="form"
        >
          <input
            type="text"
            class="border border-neutral-300 rounded-[8px] p-2 my-4 w-full"
            name="assessment1"
            formControlName="test"
          />
        </td>
      </ng-container>

      <ng-container matColumnDef="lab">
        <th mat-header-cell *matHeaderCellDef>LAB</th>
        <td mat-cell *matCellDef="let element" [formGroup]="form">
          <input
            type="text"
            class="border border-neutral-300 rounded-[8px] p-2 w-full"
            name="assessment2"
            formControlName="lab"
          />
        </td>
      </ng-container>

      <ng-container matColumnDef="exam">
        <th mat-header-cell *matHeaderCellDef>EXAM</th>
        <td mat-cell *matCellDef="let element" [formGroup]="form">
          <input
            type="text"
            class="border border-neutral-300 rounded-[8px] p-2 w-full"
            name="project1"
            formControlName="exam"
          />
        </td>
      </ng-container>

      <ng-container matColumnDef="total">
        <th mat-header-cell *matHeaderCellDef>TOTAL</th>
        <td mat-cell *matCellDef="let element" [formGroup]="form">
          <!-- {{ element.total || '-' }} -->
          <input
            type="text"
            class="border border-neutral-300 rounded-[8px] p-2 w-full"
            name="project1"
            formControlName="total"
          />
        </td>
      </ng-container>

      <ng-container matColumnDef="grade">
        <th mat-header-cell *matHeaderCellDef>FINAL GRADE</th>
        <td mat-cell *matCellDef="let element" [formGroup]="form">
          <!-- {{ element.finalGrade || '-' }} -->
          <input
            type="text"
            class="border border-neutral-300 rounded-[8px] p-2 w-full"
            name="project1"
            formControlName="grade"
          />
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>STATUS</th>
        <td mat-cell *matCellDef="let element">
          <app-status-badge type="pass" [status]="element.status || 'Pass'" />
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr
        mat-row
        *matRowDef="let row; let i = index; columns: displayedColumns"
        [formGroup]="row"
        (focusout)="saveRow(i)"
      ></tr>
    </table>
  </div>
  <app-paginator />
} @else {
  <app-empty-state
    iconSrc="images/general/empty-doc.svg"
    description="Your drafts is empty, create a course and input results to fill this page"
  />
}
