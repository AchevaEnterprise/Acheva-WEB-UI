@if (countdown() !== null) {
  <p
    class="text-center text-blue-500 px-3 bg-blue-200 rounded-full w-fit mx-auto mb-2"
  >
    Saving in {{ countdown() }}s...
  </p>
}
<form [formGroup]="form" class="w-full overflow-auto max-h-[50vh]">
  <div formArrayName="rows">
    <table mat-table [dataSource]="dataSource()">
      <ng-container matColumnDef="registrationNumber">
        <th mat-header-cell *matHeaderCellDef>REG NO</th>
        <td mat-cell *matCellDef="let row; let i = index" [formGroupName]="i">
          <!-- <app-search-select
            formControlName="registrationNumber"
            placeholder="Reg No."
            [loading]="searchingStudent()"
            [options]="filterdStudentRegNumber()"
            (searchEvent)="searchStudentsByRegNo($event)"
            (selectEvent)="onSelect($event, i)"
          /> -->
          <input
            type="text"
            class="border border-neutral-300 rounded-[8px] p-2 my-4 w-full bg-white"
            [class.border-red-500]="
              row.get('registrationNumber').invalid &&
              row.get('registrationNumber').touched
            "
            formControlName="registrationNumber"
          />
        </td>
      </ng-container>

      <ng-container matColumnDef="fullName">
        <th mat-header-cell *matHeaderCellDef>NAME</th>
        <td mat-cell *matCellDef="let row; let i = index" [formGroupName]="i">
          <input
            type="text"
            class="border border-neutral-300 rounded-[8px] p-2 my-4 w-full bg-white"
            [class.border-red-500]="
              row.get('fullName').invalid && row.get('fullName').touched
            "
            formControlName="fullName"
          />
        </td>
      </ng-container>

      <ng-container matColumnDef="test">
        <th mat-header-cell *matHeaderCellDef>TEST</th>
        <td
          mat-cell
          *matCellDef="let row; let i = index"
          class="text-center"
          [formGroupName]="i"
        >
          <input
            type="number"
            min="0"
            max="100"
            class="border border-neutral-300 rounded-[8px] p-2 my-4 w-full bg-white"
            [class.border-red-500]="
              row.get('test').invalid && row.get('test').touched
            "
            formControlName="test"
            (input)="onControlInput(i, 'test')"
          />
        </td>
      </ng-container>

      <ng-container matColumnDef="lab">
        <th mat-header-cell *matHeaderCellDef>LAB</th>
        <td mat-cell *matCellDef="let row; let i = index" [formGroupName]="i">
          <input
            type="number"
            min="0"
            max="100"
            class="border border-neutral-300 rounded-[8px] p-2 w-full bg-white"
            [class.border-red-500]="
              row.get('lab').invalid && row.get('lab').touched
            "
            formControlName="lab"
            (input)="onControlInput(i, 'lab')"
          />
        </td>
      </ng-container>

      <ng-container matColumnDef="exam">
        <th mat-header-cell *matHeaderCellDef>EXAM</th>
        <td mat-cell *matCellDef="let row; let i = index" [formGroupName]="i">
          <input
            type="number"
            min="0"
            max="100"
            class="border border-neutral-300 rounded-[8px] p-2 w-full bg-white"
            [class.border-red-500]="
              row.get('exam').invalid && row.get('exam').touched
            "
            formControlName="exam"
            (input)="onControlInput(i, 'exam')"
          />
        </td>
      </ng-container>

      <ng-container matColumnDef="total">
        <th mat-header-cell *matHeaderCellDef>TOTAL</th>
        <td mat-cell *matCellDef="let row; let i = index" [formGroupName]="i">
          {{ row.value.total }}
        </td>
      </ng-container>

      <ng-container matColumnDef="grade">
        <th mat-header-cell *matHeaderCellDef>FINAL GRADE</th>
        <td mat-cell *matCellDef="let row; let i = index" [formGroupName]="i">
          {{ row.value.grade }}
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>STATUS</th>
        <td mat-cell *matCellDef="let row; let i = index" [formGroupName]="i">
          <app-status-badge [status]="row.value.status" />
        </td>
      </ng-container>

      <!-- <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>ACTION</th>
        <td mat-cell *matCellDef="let row; let i = index" [formGroupName]="i">
          <app-button
            label="Remove"
            type="outline"
            class="btn-sm btn-error"
            (clickEvent)="removeRow(i)"
          />
        </td>
      </ng-container> -->

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr
        mat-row
        *matRowDef="let row; let i = index; columns: displayedColumns"
        [class.completed]="completedRows.has(i)"
      ></tr>
    </table>
  </div>
</form>
<div class="flex justify-end mt-4">
  <app-button label="Add row" (clickEvent)="addRow()" />
</div>
