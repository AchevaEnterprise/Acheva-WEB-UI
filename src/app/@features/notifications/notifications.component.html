<div class="notif-panel">
  <!-- Header -->
  <div class="notif-panel__header">
    <div class="notif-panel__title-group">
      <span class="notif-panel__title acva-heading-6 fw-600"
        >Notifications</span
      >
      @if (unreadCount() > 0) {
        <span class="notif-panel__unread-badge">{{ unreadCount() }}</span>
      }
    </div>

    <div class="notif-panel__header-actions">
      @if (unreadCount() > 0) {
        <button
          class="notif-panel__mark-all-btn"
          [disabled]="marking()"
          (click)="markAllAsRead()"
        >
          {{ marking() ? 'Marking…' : 'Mark all as read' }}
        </button>
      }
      <button
        class="notif-panel__close-btn"
        (click)="close()"
        aria-label="Close notifications"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 18 18"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            d="M14 4L4 14M4 4l10 10"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>
  </div>

  <!-- List -->
  <div class="notif-panel__list">
    @if (notifications().length > 0) {
      @for (
        notification of notifications();
        track trackNotification($index, notification)
      ) {
        <button
          class="notif-panel__item"
          [class.notif-panel__item--unread]="notification.status === 'UNREAD'"
          (click)="markAsRead(notification)"
          [attr.aria-label]="'Notification: ' + notification.title"
        >
          <div class="notif-panel__item-accent"></div>
          <div class="notif-panel__item-body">
            <div class="notif-panel__item-meta">
              <span class="notif-panel__item-title">{{
                notification.title
              }}</span>
              <span class="notif-panel__item-time">{{
                relativeTime(notification.createdAt)
              }}</span>
            </div>
            <p class="notif-panel__item-message">{{ notification.message }}</p>
          </div>
          @if (notification.status === 'UNREAD') {
            <span class="notif-panel__item-dot" aria-hidden="true"></span>
          }
        </button>
      }
    } @else {
      <div class="notif-panel__empty">
        <app-empty-state
          iconSrc="images/general/empty-doc.svg"
          description="You're all caught up!"
        />
      </div>
    }
  </div>
</div>
