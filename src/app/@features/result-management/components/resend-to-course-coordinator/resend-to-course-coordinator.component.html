<h2 mat-dialog-title class="flex justify-between items-center">
  Resend to Course Coordinator<br />
</h2>

<mat-dialog-content>
  <p class="acva-caption mb-8">
    Please provide the details of your issue and select its current status.
  </p>
  <app-comment [formControl]="commentCtrl" />
</mat-dialog-content>

<mat-dialog-actions class="gap-4">
  <app-button label="Cancel" type="outline" (clickEvent)="cancel()" />
  <app-button label="Submit" (clickEvent)="confrim()" />
</mat-dialog-actions>
