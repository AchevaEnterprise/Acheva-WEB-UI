<div id="container">
  <h3 class="acva-heading-5 fw-500">Result Management</h3>

  <!-- SEGMENTS -->
  <div class="mt-8">
    <div class="flex justify-between items-center">
      <app-segment-switcher
        [activeSegment]="activeSegment()"
        [segments]="segments()"
        (switchEvent)="switchSegment($event)"
      />

      <div class="flex gap-2">
        <app-button
          label="Send to CC"
          class="btn-md"
          matTooltip="Send to Course Cordinator"
          (clickEvent)="sendToCC()"
        />
        <app-button
          label="Send to HOD"
          class="btn-md"
          matTooltip="Send to Head of Department"
          (clickEvent)="sendToHOD()"
        />
        <app-button
          [label]="expandView() ? 'Collapse' : 'Expand'"
          type="outline"
          class="btn-md"
          (clickEvent)="toggleView()"
        />
      </div>
    </div>

    <div
      class="grid grid-cols-[1fr_30%] gap-4 mt-4"
      [ngClass]="{
        'grid-cols-1': expandView(),
        'grid-cols-[1fr_30%]': !expandView(),
      }"
    >
      <app-card
        [label]="activeSegment().label"
        [description]="segmentCardLabel()"
        [iconSrc]="segmentCardIconSrc()"
      >
        <ng-container content>
          <!-- Lecturer -->
          <app-result-management-file-table [expand]="expandView()" />

          <!-- Course Cordinator,  -->
          <!-- <app-result-management-folder-table [expand]="expandView()" /> -->
        </ng-container>
      </app-card>

      <!-- RESULT STATUS TRACKING & COMMENT-->
      @if (!expandView()) {
        <div class="flex flex-col gap-4">
          <app-result-status-tracking />
          <app-comment />
        </div>
      }
    </div>
  </div>
</div>
