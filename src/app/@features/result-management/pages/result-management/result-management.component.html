<div id="container">
  <h3 class="acva-heading-5 fw-500">Result Management</h3>

  <!-- SEGMENTS -->
  <div class="mt-8">
    <div class="flex justify-between flex-wrap gap-4 items-center">
      <app-segment-switcher
        [activeSegment]="activeSegment()"
        [segments]="segments()"
        (switchEvent)="switchSegment($event)"
      />

      <div class="flex gap-2">
        @if (activeSegment().value === 'DRAFT') {
          <app-button
            *appRoleAccess="[RoleEnum.LECTURER]"
            label="Send to CC"
            class="btn-md"
            matTooltip="Send to Course Cordinator"
            [loading]="sendingToCC()"
            (clickEvent)="confirmSendToCC()"
          />
        }

        @if (activeSegment().value === 'VERIFIED') {
          <app-button
            *appRoleAccess="[RoleEnum.HOD]"
            label="Send to CA"
            class="btn-md"
            matTooltip="Send to Course Adviser"
            [loading]="sendingToCA()"
            (clickEvent)="confirmSendToCA()"
          />

          <app-button
            *appRoleAccess="[RoleEnum.COURSE_ADVISOR]"
            label="Publish"
            class="btn-md"
            [loading]="publishing()"
            (clickEvent)="confirmPublishResult()"
          />
        }

        @if (activeSegment().value === 'UNVERIFIED') {
          <app-button
            *appRoleAccess="[RoleEnum.HOD]"
            label="Resend"
            class="btn-md"
            [loading]="resending()"
            [matMenuTriggerFor]="resendMenu"
          />
          <mat-menu #resendMenu="matMenu">
            <button mat-menu-item (click)="confirmResendToCC()">
              Resend to CC
            </button>
            <button mat-menu-item (click)="confirmResendToDean()">
              Resend to Dean
            </button>
          </mat-menu>
        }

        @if (activeSegment().value === 'IMPORTED') {
          <app-button
            *appRoleAccess="[RoleEnum.COURSE_ADVISOR]"
            label="Import"
            class="btn-md"
            type="outline"
            (clickEvent)="importResult()"
          />
        }

        <app-button
          [label]="expandView() ? 'Expand' : 'Collapse'"
          type="outline"
          class="btn-md"
          (clickEvent)="toggleView()"
        />
      </div>
    </div>

    <div
      class="grid grid-cols-[1fr_30%] gap-4 mt-4 items-start"
      [ngClass]="{
        'grid-cols-1': expandView(),
        'grid-cols-[1fr_30%]': !expandView(),
      }"
    >
      <app-card
        [label]="activeSegment().label"
        [description]="segmentCardLabel()"
        [iconSrc]="segmentCardIconSrc()"
      >
        <ng-container content>
          <app-result-management-file-table
            *appRoleAccess="[
              RoleEnum.LECTURER,
              RoleEnum.HOD,
              RoleEnum.DEAN,
              RoleEnum.COURSE_ADVISOR,
            ]"
            #fileTableRef
            [expand]="expandView()"
            [loading]="loadingResults()"
            [results]="results()"
            [pagination]="pagination()"
            (viewResultEvent)="viewResult($event)"
            (trackResultEvent)="trackResult($event)"
            (deleteResultEvent)="deleteResult($event)"
          />

          <ng-container *appRoleAccess="[RoleEnum.COURSE_COORDINATOR]">
            @if (activeSegment().value === 'DRAFT') {
              <app-result-management-folder-table
                #folderTableRef
                [expand]="expandView()"
                [loading]="loadingResults()"
                [groupedResults]="groupedResults()"
                [pagination]="pagination()"
                (viewFolderEvent)="viewFolder($event)"
              />
            } @else {
              <app-result-management-file-table
                #fileTableRef
                [expand]="expandView()"
                [loading]="loadingResults()"
                [results]="results()"
                [pagination]="pagination()"
                (viewResultEvent)="viewResult($event)"
                (trackResultEvent)="trackResult($event)"
              />
            }
          </ng-container>
        </ng-container>
      </app-card>

      <!-- RESULT STATUS TRACKING & COMMENT-->
      @if (!expandView()) {
        <div class="flex flex-col gap-4">
          <app-result-status-tracking [result]="result()" />
          <app-comment
            [refresh]="refreshComments()"
            [showSubmitBtn]="true"
            [resultId]="result()?._id"
            (submitEvent)="sendComment($event)"
          />
        </div>
      }
    </div>
  </div>
</div>
