<header class="mb-4 flex gap-4 justify-between items-center">
  <app-back-button />

  <app-button
    [label]="tableExpanded() ? 'Collapse Table' : 'Expand Table'"
    class="btn-sm"
    type="clear"
    (clickEvent)="toggleTableView()"
  />
</header>

@if (!tableExpanded()) {
  <app-card label="Course Analtyics" [showDivider]="true" dividerClass="!mt-4">
    <p rightHeaderContent class="acva-para-1 text-neutral-500">
      Average Grade <span class="text-neutral-800">0.0%</span>
    </p>

    <div content>
      <app-analytics-chart [data]="analyticsChartData()" />

      <div class="leading-[1.5rem] acva-caption text text-neutral-500 p-4">
        <p class="flex items-center gap-4 w-full">
          <span class="w-[15%] font-medium">Total</span>
          <span>{{ totalStudent() || 0 }}</span>
        </p>
        <p class="flex items-center gap-4 w-full">
          <span class="w-[15%] font-medium">Total Pass</span>
          <span>{{ totalStudentPass() || 0 }}</span>
        </p>
        <p class="flex items-center gap-4 w-full">
          <span class="w-[15%] font-medium">Total Fail</span>
          <span>{{ totalStudentFail() || 0 }}</span>
        </p>
      </div>
    </div>
  </app-card>

  <mat-divider class="!my-4"></mat-divider>
}

<div>
  <h4 class="acva-heading-6 fw-500 mt-4 mb-3">Student Grade</h4>

  <div class="flex gap-3 items-start justify-between">
    <app-search-input placeholder="Search students" />

    <div class="flex flex-wrap justify-end gap-3 items-center">
      <app-button
        *appRoleAccess="[RoleEnum.COURSE_COORDINATOR]"
        label="Send to Lecturer"
        class="btn-md"
        [loading]="sendingToLecturer()"
        (clickEvent)="confirmSendToLecturer()"
      />

      <app-button
        *appRoleAccess="[RoleEnum.COURSE_COORDINATOR]"
        label="Send to HOD"
        class="btn-md"
        matTooltip="Send to Head of Department"
        [loading]="sendingToHOD()"
        (clickEvent)="confirmSendToHOD()"
      />

      <!-- <app-button
        label="Delete File"
        type="clear"
        icon="icons/general/trash-icon.svg"
        class="btn-md"
      /> -->
      <app-button
        [label]="expandView() ? 'Expand' : 'Collapse'"
        type="outline"
        class="btn-md"
        (clickEvent)="toggleView()"
      />
    </div>
  </div>
</div>

<div
  class="grid grid-cols-[1fr_30%] gap-4 mt-4 items-start"
  [ngClass]="{
    'grid-cols-1': expandView(),
    'grid-cols-[1fr_30%]': !expandView(),
  }"
>
  <app-result-management-file-table
    #resultTableRef
    [expand]="expandView()"
    [results]="results()"
    [pagination]="pagination()"
    (viewResultEvent)="editResult($event)"
    (trackResultEvent)="trackResult($event)"
  />

  <!-- RESULT STATUS TRACKING & COMMENT-->
  @if (!expandView()) {
    <div class="flex flex-col gap-4">
      <app-result-status-tracking [result]="result()" />
      <app-comment
        [refresh]="refreshComments()"
        [showSubmitBtn]="true"
        [resultId]="result()?._id"
        (submitEvent)="sendComment($event)"
      />
    </div>
  }
</div>
