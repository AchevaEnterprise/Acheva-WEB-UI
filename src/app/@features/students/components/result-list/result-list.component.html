<div class="rounded-[12px] p-4 h-full bg-white">
  <h3 class="acva-heading-4">All Results</h3>
  <p class="acva-para-1 text-gray-500">
    Access all results across your different semesters and sessions.
  </p>

  <div class="mt-8 overflow-y-auto h-[calc(100vh_-_40vh)]">
    @if (loading()) {
      <app-skeleton-table [cols]="2" [rows]="6" />
    } @else {
      <ul>
        @for (session of sessionsList(); track session) {
          <li
            class="cursor-pointer hover:bg-gray-100 p-2 py-[1rem] px-[0.6938rem] flex gap-2 rounded-lg"
            [ngClass]="{
              'text-[#43413E]': session.active,
              'text-gray-300': !session.active,
            }"
            tabindex="0"
            (click)="viewSessionResult(session)"
            (keydown)="viewSessionResult(session)"
          >
            @if (session.active) {
              <app-svg
                src="icons/general/result-enabled-icon.svg"
                svgWidth="2rem"
              />
            } @else {
              <app-svg
                src="icons/general/result-disabled-icon.svg"
                svgWidth="2rem"
              />
            }

            <div>
              <h5 class="font-semibold">{{ session.level }}</h5>
              <p class="text-[.9rem]">{{ session.session }} Academic Session</p>
            </div>
          </li>
        }
      </ul>
    }
  </div>
</div>
