<div id="container">
  <h3 class="acva-heading-5 fw-500">Student List</h3>

  <div class="mt-8">
    <!-- SEARCH FILTERS -->
    <div class="flex flex-wrap justify-between gap-3">
      <app-search-input
        placeholder="Search student name"
        [formControl]="searchCtrl"
      />

      <div class="flex gap-3">
        <app-button
          label="Upload File"
          class="btn-md"
          [loading]="uploading()"
          (clickEvent)="uploadFile()"
        />

        <app-button
          label="Add New Student"
          class="btn-md"
          type="outline"
          (clickEvent)="addStudent()"
        />
      </div>
    </div>

    <p class="text-right">
      <a
        href="template/student-template.xlsx"
        class="underline text-blue-500"
        download="Student List Template"
        >Student List Template</a
      >
    </p>

    @if (loading()) {
      <app-loader />
    } @else {
      @if (dataSource().length > 0) {
        <div class="w-full overflow-auto max-h-[100vh]">
          <table mat-table [dataSource]="dataSource()">
            <ng-container matColumnDef="sn">
              <th mat-header-cell *matHeaderCellDef>S/N</th>
              <td mat-cell *matCellDef="let student; let i = index">
                {{ i + 1 }}.
              </td>
            </ng-container>

            <ng-container matColumnDef="registrationNumber">
              <th mat-header-cell *matHeaderCellDef>REG NO</th>
              <td mat-cell *matCellDef="let student">
                {{ student.registrationNumber }}
              </td>
            </ng-container>

            <ng-container matColumnDef="fullName">
              <th mat-header-cell *matHeaderCellDef>NAME</th>
              <td mat-cell *matCellDef="let student">
                {{ student.fullName | titlecase }}
              </td>
            </ng-container>

            <!-- <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef>Actions</th>
              <td mat-cell *matCellDef="let student">
                <app-button
                  label="Deactivate"
                  class="btn-sm"
                  type="outline"
                  (clickEvent)="toggleActivateDeactivate(student)"
                />
              </td>
            </ng-container> -->

            <tr
              mat-header-row
              *matHeaderRowDef="displayedColumns; sticky: true"
            ></tr>
            <tr
              mat-row
              *matRowDef="let row; columns: displayedColumns"
              class="cursor-pointer"
              (click)="viewStudentResult(row.registrationNumber)"
              (keydown)="viewStudentResult(row.registrationNumber)"
            ></tr>
          </table>
        </div>
      } @else {
        <app-empty-state
          iconSrc="images/general/empty-doc.svg"
          description="No students found, please add students to see them listed here"
        />
      }
    }
  </div>
</div>
