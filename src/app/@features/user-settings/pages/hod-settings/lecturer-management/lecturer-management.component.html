<div class="mt-3">
  <div class="flex justify-between">
    <h3 class="acva-heading-5 fw-500">Lecturer Management</h3>

    <div class="flex flex-wrap gap-3">
      <app-search-input placeholder="Search lecturer" />

      <div class="input-style-1 acheva-input">
        <mat-form-field [style.width.%]="100" appearance="outline">
          <span matPrefix>
            <app-svg
              svgWidth="1.3rem"
              svgHeight="1.3rem"
              src="icons/general/filter-icon.svg"
            ></app-svg>
          </span>

          <mat-select placeholder="Filter">
            <mat-option [value]="'Science'">Science</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>
  </div>
  <div class="w-full overflow-auto">
    <table mat-table [dataSource]="dataSource()">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>NAME</th>
        <td mat-cell *matCellDef="let element">
          {{ element.firstname }} {{ element.lastname }}
        </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>EMAIL</th>
        <td mat-cell *matCellDef="let element">
          {{ element.email }}
        </td>
      </ng-container>

      <ng-container matColumnDef="level">
        <th mat-header-cell *matHeaderCellDef>LEVEL</th>
        <td mat-cell *matCellDef="let element">
          {{ element.level }}
        </td>
      </ng-container>

      <ng-container matColumnDef="lastDateModified">
        <th mat-header-cell *matHeaderCellDef>LAST MODIFIED DATE</th>
        <td mat-cell *matCellDef="let element">
          {{ element.lastDateModified | date: 'MMM d, YYYY h:mm a' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>ACTION</th>
        <td mat-cell *matCellDef="let element">
          <app-button
            label="Assign"
            type="outline"
            class="btn-sm"
            (clickEvent)="confirmAssignAsCourseAdvisor(element)"
          />
        </td>
      </ng-container>

      <ng-container matColumnDef="assign">
        <th mat-header-cell *matHeaderCellDef>ASSIGN</th>
        <td mat-cell *matCellDef="let element">
          <mat-slide-toggle></mat-slide-toggle>
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>STATUS</th>
        <td mat-cell *matCellDef="let element">
          <app-status-badge status="Active" />
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
  <app-paginator />
</div>
