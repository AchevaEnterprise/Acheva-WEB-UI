<!-- HOD SETTINGS -->
<section class="settings" *appRoleAccess="[RoleEnum.HOD]">
  <!-- Identity, stated once and small. This is a directory of things to
       administer, not a profile page. -->
  <header class="settings__head">
    <span class="settings__avatar" aria-hidden="true">{{ initials() }}</span>
    <div class="settings__who">
      <h1 class="acva-heading-5 fw-500 m-0">{{ heading() }}</h1>
      <p class="acva-para-1 text-neutral-500 m-0">{{ subheading() }}</p>
    </div>
  </header>

  <div class="settings__bar">
    <h2 class="acva-para-2 fw-500 m-0">Manage your department</h2>

    <label class="settings__search">
      <span class="settings__search-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="6.25" />
          <path d="m15.6 15.6 3.6 3.6" />
        </svg>
      </span>
      <input
        type="search"
        class="settings__search-input acva-para-1"
        placeholder="Find a setting"
        aria-label="Find a setting"
        [value]="search()"
        (input)="search.set($any($event.target).value)"
      />
    </label>
  </div>

  @if (filtered().length === 0) {
    <p class="settings__empty acva-para-1">
      Nothing here matches “{{ search() }}”.
    </p>
  } @else {
    <ul class="tiles">
      @for (tile of filtered(); track tile.route) {
        <li>
          <a class="tile" [routerLink]="tile.route">
            <span class="tile__icon" aria-hidden="true">
              <app-svg svgWidth="1.5rem" svgHeight="1.5rem" [src]="tile.icon" />
            </span>

            <span class="tile__body">
              <span class="acva-para-2 fw-500 tile__title">{{
                tile.label
              }}</span>
              <span class="acva-para-1 tile__desc">{{ tile.description }}</span>
            </span>

            <span class="tile__chevron" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M9.5 5.5 16 12l-6.5 6.5" />
              </svg>
            </span>
          </a>
        </li>
      }
    </ul>
  }
</section>
