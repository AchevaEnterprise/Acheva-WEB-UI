<app-side-bar (toggleSideNav)="onToggleSideNav($event)" />

<div
  class="w-[calc(100%_-_5rem)] h-[100vh] overflow-hidden ml-[5rem] z-0 relative top-0 bg-[#f4f7fa] transition-all duration-300 ease-in-out"
  [class]="getBodyClass()"
>
  <app-tool-bar />

  <!-- Most pages are documents: they sit on the page ground with a margin and
       scroll as a whole. A few — the chat — are applications that own their
       viewport and scroll internally, so the shell hands them every pixel it
       has instead of framing them. Declared per route as `fullBleed`. -->
  <div class="content" [class.content--full-bleed]="fullBleed()">
    <router-outlet></router-outlet>
  </div>
</div>
