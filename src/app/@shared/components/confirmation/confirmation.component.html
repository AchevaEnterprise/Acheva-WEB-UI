<h2 mat-dialog-title class="flex justify-between items-center">
  Confirmation required <br />
</h2>

<mat-dialog-content>
  <div class="grid place-content-center gap-8 text-center">
    <app-svg [src]="'images/general/confirmation.svg'" />
    <p>
      {{ data.message }}
    </p>
  </div>
</mat-dialog-content>

<mat-dialog-actions class="gap-4">
  <app-button label="Cancel" type="outline" (clickEvent)="cancel()" />
  <app-button label="Confirm" (clickEvent)="confrim()" />
</mat-dialog-actions>
