<div class="autocomplete-container">
  <mat-form-field appearance="outline">
    <mat-label *ngIf="label">{{ label }}</mat-label>

    <input
      matInput
      type="text"
      [(ngModel)]="inputValue"
      (input)="onInputChange($event)"
      (blur)="onInputBlur()"
      (focus)="onInputFocus()"
      [placeholder]="placeholder"
      autocomplete="off"
    />

    <!-- <mat-icon
      matSuffix
      *ngIf="inputValue"
      (click)="clearInput()"
      class="clear-icon"
    >
      close
    </mat-icon> -->

    <mat-hint *ngIf="hint">{{ hint }}</mat-hint>
  </mat-form-field>

  <ul
    *ngIf="showSuggestions && filteredItems.length > 0"
    class="suggestions-list mat-elevation-z4"
  >
    <li
      *ngFor="let item of filteredItems; trackBy: trackByFn"
      (mousedown)="selectItem(item)"
      class="suggestion-item"
    >
      <span class="suggestion-text">{{ getDisplayText(item) }}</span>
    </li>
  </ul>
</div>
