<div class="flex gap-4 mt-4 justify-between items-center">
  <p class="acva-caption text-neutral-500">
    Showing {{ range().from }} to {{ range().to }} of {{ range().total }}
  </p>

  <mat-paginator
    [length]="paginator()?.total || 1"
    [pageSize]="paginator()?.pageSize || 1"
    [pageIndex]="(paginator()?.page || 1) - 1"
    [pageSizeOptions]="pageSizeOptions()"
    [hidePageSize]="hidePageSize()"
    [showFirstLastButtons]="showFirstLastButtons()"
    [disabled]="disabled()"
    (page)="onPageChange($event)"
    aria-label="Select page"
  />
</div>
