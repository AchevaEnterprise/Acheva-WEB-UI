<div
  class="bg-[#C4C4C433] rounded-[10px] p-1 min-h-[2.5rem] flex flex-wrap gap-[5px] w-fit"
>
  @for (segment of segments(); track $index) {
    @if (segment.accessRole) {
      <button
        *appRoleAccess="segment.accessRole"
        (click)="switchSegment(segment.value)"
        class="rounded-[8px] px-3 cursor-pointer transition-all"
        [ngClass]="
          segment.value === activeSegment()?.value
            ? 'text-blue-400 bg-white'
            : 'text-neutral-500'
        "
      >
        {{ segment.label }}
      </button>
    } @else {
      <button
        (click)="switchSegment(segment.value)"
        class="rounded-[8px] px-3 cursor-pointer transition-all"
        [ngClass]="
          segment.value === activeSegment()?.value
            ? 'text-blue-400 bg-white'
            : 'text-neutral-500'
        "
      >
        {{ segment.label }}
      </button>
    }
  }
</div>
